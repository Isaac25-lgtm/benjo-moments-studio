# Render Blueprint for a single-instance Benjo Moments deployment.

services:
  - type: web
    name: benjo-moments-studio
    runtime: python
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: python -m pip install --no-cache-dir -r requirements.txt && python -m compileall -q .
    # -----------------------------------------------------------------------
    # preDeployCommand: runs ONCE before the new instance starts serving.
    # Applies any pending Alembic migrations safely on each deploy.
    # -----------------------------------------------------------------------
    preDeployCommand: python -m alembic upgrade head
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile - --log-level info
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      # Set DATABASE_URL in Render dashboard to your Neon connection string:
      # postgresql+psycopg2://neondb_owner:<password>@<host>.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: TEST_AUTH_MODE
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "15"
      # Optional: set TEST_PIN to restrict test-mode logins
      # - key: TEST_PIN
      #   sync: false
      - key: UPLOAD_FOLDER
        value: /opt/render/project/data/uploads
      # Set both in Render dashboard — do NOT hardcode credentials
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
    disk:
      name: benjo-moments-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    healthCheckPath: /healthz
